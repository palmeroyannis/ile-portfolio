<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yannis Palmero — Portfolio interactif</title>
    <link
      data-trunk
      rel="rust"
      data-initializer="chargement.js"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/polices/Inter-Regular.otf") format("opentype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/polices/Inter-SemiBold.otf") format("opentype");
        font-weight: 600;
      }
      html, body { margin: 0; height: 100%; background: #0b1b33; overflow: hidden; }
      #jeu { width: 100%; height: 100%; display: block; outline: none; }

      /* --- Écran de chargement --- */
      #chargement {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a1730;
        color: #f4f6f9;
        font-family: "Inter", system-ui, sans-serif;
        transition: opacity 0.8s ease;
        z-index: 10;
      }
      #chargement.fini { opacity: 0; pointer-events: none; }
      .panneau {
        width: min(520px, 86vw);
        padding: 36px 40px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.02);
      }
      h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.01em; }
      .sous-titre { margin: 6px 0 28px; color: #33d1cc; font-size: 15px; }
      .piste { position: relative; height: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.15); }
      #barre { height: 100%; width: 0; background: #33d1cc; }
      /* Balayage lumineux pendant la préparation : animé par la carte graphique,
         il continue même quand le navigateur est occupé à démarrer le jeu */
      .piste::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        transform: translateX(-100%);
        will-change: transform;
      }
      #chargement.preparation .piste::after { animation: balayage 1.1s linear infinite; }
      @keyframes balayage {
        from { transform: translateX(-100%); }
        to { transform: translateX(400%); }
      }
      #etat { margin: 12px 0 28px; font-size: 14px; color: #aeb9cc; }
      .commandes {
        margin: 0 0 24px;
        padding: 16px 0 0;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        font-size: 14px;
        color: #aeb9cc;
      }
      .commandes b { color: #f4f6f9; font-weight: 600; }
      .mobile { display: none; margin: 0 0 20px; font-size: 14px; color: #ffcf6e; }
      @media (hover: none) and (pointer: coarse) { .mobile { display: block; } }
      #chargement.echec #barre { background: #e06a5a; }
      a { color: #33d1cc; font-size: 14px; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <canvas id="jeu"></canvas>

    <div id="chargement">
      <div class="panneau">
        <h1>Yannis Palmero</h1>
        <p class="sous-titre">Ingénieur mécanique · Portfolio interactif</p>
        <div class="piste"><div id="barre"></div></div>
        <p id="etat">Chargement…</p>
        <div class="commandes">
          <b>Z Q S D / flèches</b><span>se déplacer</span>
          <b>Espace</b><span>sauter</span>
          <b>E</b><span>voir un projet</span>
        </div>
        <p class="mobile">Le jeu se joue au clavier, sur ordinateur.</p>
        <a href="https://palmeroyannis.github.io/portfolio/">Voir la version classique du portfolio →</a>
      </div>
    </div>
  </body>
</html>
