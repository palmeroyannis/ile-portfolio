[package]
name = "portfolio-jeu"
version = "0.1.0"
edition = "2021"

[dependencies]
avian3d = "0.7"
bevy = { version = "0.19", features = ["jpeg"] }

# Compilation rapide de notre code, moteur optimisé (sinon le jeu rame en mode dev)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Version mise en ligne : la plus légère possible
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true

# Dans le navigateur uniquement : masquer l'écran de chargement une fois l'île affichée
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList"] }
