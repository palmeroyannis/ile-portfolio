# Compile le jeu pour le navigateur et le publie sur GitHub Pages à chaque envoi sur « main ».
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust et la cible navigateur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Garder les compilations précédentes en cache
        uses: Swatinem/rust-cache@v2

      - name: Installer trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compiler la version optimisée
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
